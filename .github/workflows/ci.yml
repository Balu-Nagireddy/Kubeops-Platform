name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint-and-scan:
    name: Lint, Build & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Validate setup script syntax
        run: bash -n setup.sh

      - name: Lint application Helm chart
        run: helm lint chart/

      - name: Render application chart with representative overrides
        run: |
          helm template demo ./chart \
            --set replicaCount=3 \
            --set config.appName=ci-demo \
            --set config.version=2.0.0 \
            --set ingress.host=demo.local > /tmp/application-manifests.yaml
          test -s /tmp/application-manifests.yaml

      - name: Lint Part 4 debug chart
        run: helm lint lab/broken-chart/

      - name: Render Part 4 debug chart
        run: |
          helm template debug-lab ./lab/broken-chart > /tmp/debug-lab-manifests.yaml
          test -s /tmp/debug-lab-manifests.yaml

      - name: Build Docker image
        run: docker build --pull -t eb-demo-app:test service/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eb-demo-app:test
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: HIGH,CRITICAL
